<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="build-a-stylized-to-do-list.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="bg-card">
        <h1>Ultimate To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="checkbox1">
                <label for="checkbox1">Weekly Workout</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.hevyapp.com/" target="_blank">Go to workout app</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="checkbox2">
                <label for="checkbox2">Drink Multivitamin</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.google.com/search?q=multivitamin" target="_blank">Restock link</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="checkbox3">
                <label for="checkbox3">Learn Coding</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">freeCodeCamp website</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="checkbox4">
                <label for="checkbox4">Buy a laptop</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://ibox.co.id/catalog/macbook-air-759" target="_blank">iBox website</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
