<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="design-a-feature-selection-page.css">
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label for="usb-interface" class="feature-card">
            <h2>USB Interface</h2>
            <input id="usb-interface" type="checkbox" name="usb-interface">
        </label>
        <label for="32-bit" class="feature-card">
            <h2>32-bit Float</h2>
            <input id="32-bit" name="32-bit" type="checkbox">
        </label>
        <label for="clear-tone" class="feature-card">
            <h2>ClearTone&trade; Preamp</h2>
            <input id="clear-tone" name="clear-tone" type="checkbox">
        </label>
        <label for="combo" class="feature-card">
            <h2>XLR-1/4" Combo</h2>
            <input id="combo" name="combo" type="checkbox">
        </label>
    </div>
</body>

</html>
