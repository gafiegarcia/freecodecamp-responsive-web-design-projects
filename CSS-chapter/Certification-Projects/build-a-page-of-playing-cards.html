<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="build-a-page-of-playing-cards.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
  <main id="playing-cards">
    <div class="card black">
      <div class="left">
        <p>A</p>
        <p class="spade symbol">♠</p>
      </div>
      <div class="middle">
        <p class="spade symbol">♠</p>
      </div>
      <div class="right">
        <p class="spade symbol">♠</p>
        <p>A</p>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <p>2</p>
        <p class="symbol">♥</p>
      </div>
      <div class="middle">
        <p class="symbol">♥</p>
        <p>&nbsp;</p>
        <p class="v-flip symbol">♥</p>
      </div>
      <div class="right">
        <p class="symbol">♥</p>
        <p>2</p>
      </div>
    </div>
    <div class="card black">
      <div class="left">
        <p>3</p>
        <p class="symbol">♣</p>
      </div>
      <div class="middle">
        <p class="symbol">♣</p>
        <p class="symbol">♣</p>
        <p class="v-flip symbol">♣</p>
      </div>
      <div class="right">
        <p class="symbol">♣</p>
        <p>3</p>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <p>4</p>
        <p class="symbol">♦</p>
      </div>
      <div class="middle">
        <div>
          <p class="symbol">♦</p>
          <p class="symbol">♦</p>
        </div>
        <p>&nbsp;</p>
        <div>
          <p class="symbol">♦</p>
          <p class="symbol">♦</p>
        </div>
      </div>
      <div class="right">
        <p class="symbol">♦</p>
        <p>4</p>
      </div>
    </div>
  </main>
</body>

</html>
