<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="design-a-contact-form.css">
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Us!</h2>
            <label for="name">
                Name: 
                <input type="text" id="name" name="name" required>
            </label>
            <label for="email">
                Email: 
                <input type="email" id="email" name="email" required>
            </label>
            <label for="message">
                Message: 
                <textarea id="message" name="message" placeholder="Tell us anything!" rows="2" required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
